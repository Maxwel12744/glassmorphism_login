<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
  </head>
  <body>
    <h1>Welcome, {{ user.username }}!</h1>
    <a href="{% url 'logout' %}">Log out</a>

    <h2>Registered users</h2>
    <table border="1" cellpadding="8">
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Joined</th>
      </tr>
      {% for p in profiles %}
      <tr>
        <td>{{ p.user.username }}</td>
        <td>{{ p.user.email }}</td>
        <td>{{ p.phone }}</td>
        <td>{{ p.created_at|date:"d M Y, H:i" }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">No records yet.</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
